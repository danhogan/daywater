# Optional overlay. Use with docker-compose.yml after logging in on the host.
# DAYWATER_CODEX_AUTH_FILE must be an absolute path to the host auth.json.
services:
  daywater-web:
    environment:
      CODEX_HOME: /app/sessions/.codex
    volumes:
      - type: bind
        source: ${DAYWATER_CODEX_AUTH_FILE:?Set DAYWATER_CODEX_AUTH_FILE to your host Codex auth.json}
        target: /app/sessions/.codex/auth.json
        read_only: true
